<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жду 14 июня 🤍</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="countdown-container">
        <div class="heart-icon">🤍</div>
        <h1>До самого важного дня:</h1>
        
        <div class="timer" id="timer">
            <div class="time-box">
                <span id="days">00</span>
                <p>Дней</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Часов</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Минут</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Секунд</p>
            </div>
        </div>

        <div class="message" id="message">Этот день настал! Ура! 🎉🤍</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
    // Устанавливаем целевую дату: 14 июня 2026 года, 00:00:00
    const targetDate = new Date("June 14, 2026 00:00:00").getTime();

    // Обновляем таймер каждую секунду (1000 миллисекунд)
    const timerInterval = setInterval(() => {
        // Получаем текущее время
        const now = new Date().getTime();
        
        // Считаем разницу между целевой датой и сейчас
        const distance = targetDate - now;

        // Если время вышло (наступило 14 июня)
        if (distance < 0) {
            clearInterval(timerInterval); // Останавливаем таймер
            document.getElementById("timer").style.display = "none";
            document.querySelector("h1").style.display = "none";
            
            // Показываем финальное сообщение
            const message = document.getElementById("message");
            message.style.display = "block";
            return;
        }

        // Математика для конвертации миллисекунд в дни, часы, минуты и секунды
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Функция для добавления нуля спереди (чтобы было "09", а не "9")
        const formatTime = (time) => time < 10 ? `0${time}` : time;

        // Выводим результаты в HTML
        document.getElementById("days").innerText = formatTime(days);
        document.getElementById("hours").innerText = formatTime(hours);
        document.getElementById("minutes").innerText = formatTime(minutes);
        document.getElementById("seconds").innerText = formatTime(seconds);
    }, 1000);
});
    </script>
</body>
</html>
